<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app">פנקס שיקים · פייסל פרחאת</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4A1730; --ink-2:#6E2848; --paper:#F4EEF1; --slip:#FDFAFB; --brass:#A27A2C;
  --text:#2A1820; --muted:#6E5C64; --line:#E1D4DA; --stamp:#B0362B; --ok:#2F6B4F;
  --serif:'Frank Ruhl Libre','David',serif;
  --sans:'Heebo','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
:root[lang="ar"]{--serif:'Amiri','Frank Ruhl Libre',serif;--sans:'IBM Plex Sans Arabic','Heebo',Tahoma,sans-serif}
:root[lang="en"]{--serif:'Frank Ruhl Libre',Georgia,serif;--sans:'Heebo','Segoe UI',Arial,sans-serif}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1A0F14; --slip:#26161E; --text:#F0E6EA; --muted:#B19FA7; --line:#3E2A33;
    --ink:#33101F; --ink-2:#D08AA8; --brass:#D7B064; --stamp:#EE7A70; --ok:#72C49D;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
[hidden]{display:none!important}
.guilloche{
  background-color:var(--ink);color:#F2EBD6;
  background-image:repeating-radial-gradient(circle at 100% 0,rgba(255,255,255,.045) 0 1px,transparent 1px 8px);
}

/* ===== شاشة الدخول ===== */
#authView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px}
.auth-card{width:min(420px,100%);background:var(--slip);color:var(--text);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-head{padding:26px 24px 18px}
.auth-head h1{font-family:var(--serif);font-size:2.4rem;margin:0;line-height:1.15}
.auth-head p{margin:2px 0 0;color:#E6CCD6}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.auth-tabs button{background:none;border:0;padding:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.auth-tabs button[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--brass)}
.auth-body{padding:20px 24px 24px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.88rem;margin-top:12px}
.setup{padding:20px 24px;font-size:.92rem}
.setup code{background:var(--paper);padding:1px 6px;border-radius:4px;direction:ltr;display:inline-block}

/* ===== التطبيق ===== */
header.top{padding:calc(22px + env(safe-area-inset-top,0px)) 20px 22px}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1.title{font-family:var(--serif);font-weight:700;font-size:2.4rem;margin:0;line-height:1.15}
.sub{color:#E6CCD6;margin:2px 0 18px;font-size:.95rem}
.head-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hint{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.out-save{background:#E8D6A2!important;color:#4A1730!important;border-color:#E8D6A2!important;font-weight:600}
.fs{margin:-12px 0 14px;font-size:.82rem;color:#E6CCD6;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fs:empty{display:none}
.ver{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:10px;margin:0;font-size:.7rem;color:rgba(242,235,214,.45)}
header.top{position:relative}
.fs .dot{width:8px;height:8px;border-radius:50%;background:#7BD4A6;display:inline-block}
.fs .dot.off{background:#E4A35A}
.fs button{background:none;border:0;color:#E8D6A2;text-decoration:underline;cursor:pointer;padding:0;font-size:.82rem}
.langSel{background:transparent;color:#F2EBD6;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 8px;font-size:.85rem;cursor:pointer}
.langSel option{color:#2A1820}
.auth-lang{display:flex;justify-content:flex-end;margin-bottom:8px}
.out{background:transparent;border:1px solid rgba(255,255,255,.3);color:#F2EBD6;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:8px;overflow:hidden}
.stat{background:var(--ink);padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:1.45rem;color:#E8D6A2;line-height:1.35}
.stat .sub2{display:block;font-size:.75rem;opacity:.85;margin-top:2px}
.stat span{font-size:.82rem;color:#E6CCD6}

main{padding:18px 20px 60px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--slip)}
.btn{border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.6;cursor:default}
.btn-main{background:var(--ink-2);color:#fff}
@media (prefers-color-scheme: dark){.btn-main{color:#1A0F14}}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-wide{width:100%;margin-top:6px}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.alerts:empty{display:none}
.al{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--slip);font-size:.93rem}
.al b{font-weight:600}
.al.late{border-color:var(--stamp);border-inline-start:4px solid var(--stamp)}
.al.today{border-inline-start:4px solid var(--brass)}
#dayDlg{width:min(760px,95vw)}
#dayDlg .f-form{padding:18px 20px 20px}
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.day-box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column}
.day-box.today{border-top:5px solid var(--brass)}.day-box.tom{border-top:5px solid var(--ink-2)}
.day-box h3{margin:0;font-family:var(--serif);font-size:1.5rem}.day-box h3 small{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:500}
.day-sum{font-family:var(--serif);font-size:2rem;font-weight:700;margin:4px 0 6px;direction:ltr;text-align:start}
.day-sum span{display:block;font-family:var(--sans);font-size:.9rem;font-weight:500;color:var(--muted);direction:rtl}
.day-box ul{list-style:none;margin:0 0 10px;padding:0;max-height:34vh;overflow:auto;flex:1}
.day-box li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.day-box li b{direction:ltr;white-space:nowrap}
.day-box li em{font-style:normal;font-size:.72rem;color:#fff;background:var(--stamp);border-radius:4px;padding:0 6px;margin-inline-start:6px}
@media (max-width:640px){.day-grid{grid-template-columns:1fr}}
.lim-top{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.lim-top .f{flex:1;min-width:220px;margin:0}
.lim-nav{display:flex;align-items:center;gap:10px}.lim-nav b{font-family:var(--serif);font-size:1.4rem;min-width:100px;text-align:center}
:root[dir="ltr"] .lim-nav{flex-direction:row-reverse}
.lim-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.lim-wd{font-size:.8rem;color:var(--muted);text-align:center;padding:4px 0}
.lim-day{background:var(--slip);border:1px solid var(--line);border-radius:8px;padding:6px 7px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.lim-day.empty{background:transparent;border:0}
.lim-day.closed{background:repeating-linear-gradient(135deg,var(--paper) 0 6px,var(--slip) 6px 12px);border-style:dashed}
.lim-closed{font-size:.8rem;color:var(--muted);text-align:center;margin:auto 0;line-height:1.3}
.dhint{font-size:.8rem;color:var(--muted);margin:4px 0 0;min-height:1.2em}.dhint.warn-closed{color:var(--brass);font-weight:600}
.ctag{font-size:.72rem;font-weight:600;color:var(--brass);border:1px dashed var(--brass);border-radius:4px;padding:0 6px;margin-inline-start:8px;white-space:nowrap}
.lim-day.lim-past{opacity:.55}
.lim-day.today{outline:2px solid var(--brass)}
.lim-num{font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1}
.lim-in{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:.85rem;direction:ltr;text-align:start}
.lim-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}.lim-bar i{display:block;height:100%;background:var(--ok)}
.lim-day.near .lim-bar i{background:var(--brass)}.lim-day.over .lim-bar i{background:var(--stamp)}.lim-day.over{border-color:var(--stamp)}
.lim-used{font-size:.72rem;color:var(--muted);direction:ltr;text-align:start;line-height:1.3}.lim-used span{display:block}
.lim-free{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.lim-free .chip,.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.88rem;color:var(--text)}
@media (max-width:640px){.lim-grid{gap:3px}.lim-day{padding:4px;min-height:84px}.lim-in{font-size:.75rem;padding:4px}.lim-used{font-size:.62rem}}
#outApp.arch-mode .stats,#outApp.arch-mode #newBtn,#outApp.arch-mode #bulkBtn{display:none!important}
.arc-years{padding-bottom:2px}
.al.arch-sum{gap:18px;justify-content:flex-start}.al.arch-sum .a-ok b{color:var(--ok)}.al.arch-sum .a-ret b{color:var(--stamp)}.al.arch-sum .a-can b{color:var(--muted)}
#report{display:none}
@media print{
  body > *:not(#report){display:none!important}
  html,body{background:#fff!important;color:#000!important}
  #report{display:block;font-family:var(--sans);color:#000;padding:0 4mm}
  #report h1{font-family:var(--serif);font-size:20pt;margin:0 0 2mm}
  #report .rep-sub{margin:0 0 5mm;color:#444;font-size:10pt}
  #report table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:6mm}
  #report th,#report td{border:1px solid #999;padding:3px 6px;text-align:start}
  #report thead th{background:#eee}
  #report .rep-sum{width:auto;min-width:50%}
  #report .n{direction:ltr;text-align:end;white-space:nowrap}
  @page{size:A4;margin:12mm}
}
.al.tom{border-inline-start:4px solid var(--ink-2)}
.al.tom b{font-size:1.05em}
.al.week{border-inline-start:4px solid var(--ok)}
.al button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.82rem;white-space:nowrap}
.sections{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.sec{background:none;border:0;border-bottom:3px solid transparent;padding:8px 16px;cursor:pointer;font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--muted);white-space:nowrap}
.sec[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--brass)}
.sec-tools{display:flex;gap:4px;align-items:center;margin-inline-start:auto;padding-inline-start:12px}
.sec-btn{background:none;border:1px dashed var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.8rem;color:var(--muted);white-space:nowrap}
.sec-btn:hover{color:var(--text);border-color:var(--muted)}
.sec small{font-family:var(--sans);font-size:.78rem;font-weight:500;margin-inline-start:4px}
.zoom{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--slip);font-size:.8rem;color:var(--muted);cursor:pointer}
.zoom .zs{font-size:.7rem}.zoom .zl{font-size:1.05rem}
.zoom input{width:110px;accent-color:var(--ink-2)}
.zoom output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
#list{zoom:var(--z,1)}
.months{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scroll-snap-type:x proximity}
.mchip{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--slip);border-radius:8px;padding:6px 12px;cursor:pointer;text-align:center;line-height:1.3;min-width:96px}
.mchip b{display:block;font-family:var(--serif);font-size:1.02rem}
.mchip span{display:block;font-size:.75rem;color:var(--muted)}
.mchip.past{opacity:.6}
.mchip.all{position:sticky;inset-inline-start:0;z-index:1;box-shadow:-8px 0 10px -6px rgba(0,0,0,.18)}
.mchip.cur{border-color:var(--brass)}
.mchip[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:#fff;opacity:1}
.mchip[aria-pressed="true"] span{color:inherit;opacity:.85}
@media (prefers-color-scheme: dark){.mchip[aria-pressed="true"]{color:#1A0F14}}
.slip.flash{box-shadow:0 0 0 3px var(--brass);transition:box-shadow .6s}
.past{margin-top:28px;border:1px solid var(--line);border-radius:8px;background:var(--slip)}
.past summary{cursor:pointer;padding:10px 14px;color:var(--muted);font-size:.92rem;list-style:none;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.past summary::-webkit-details-marker{display:none}
.past summary b{color:var(--text);font-weight:600}
.past summary::before{content:'◂';margin-inline-end:6px}
.past[open] summary::before{content:'▾'}
.pm{border-top:1px solid var(--line);padding:6px 14px 10px}
.pm-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 0 4px}
.pm-head button{background:none;border:0;padding:0;font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--text);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.pm-head span{font-size:.82rem;color:var(--muted)}
.mini{display:grid;grid-template-columns:3.2em 1fr auto;gap:2px 10px;font-size:.85rem;padding:3px 0;color:var(--muted)}
.mini .p{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .a{direction:ltr;color:var(--text)}
.mini.late .p::after{content:' • עדיין לא נפרע';color:var(--stamp);font-size:.78rem}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.85rem;margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;white-space:nowrap;cursor:pointer;font-size:.9rem}
.tab[aria-pressed="true"]{background:var(--text);color:var(--paper);border-color:var(--text)}
.tab small{opacity:.7;margin-inline-start:4px}

.month{font-family:var(--serif);font-size:1.35rem;font-weight:700;margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px}
.month span{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--muted)}

.slip{display:grid;grid-template-columns:92px 1fr;background:var(--slip);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.stub{border-inline-end:2px dashed var(--line);padding:12px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.stub .d{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1}
.stub .m{font-size:.8rem;color:var(--muted)}
.stub .no{font-size:.75rem;color:var(--muted);margin-top:6px;direction:ltr}
.body{padding:12px 16px;min-width:0}
.row1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.payee{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.amt{font-family:var(--serif);font-size:1.6rem;font-weight:700;white-space:nowrap;direction:ltr}
.meta{color:var(--muted);font-size:.88rem}
.notes{font-size:.88rem;margin-top:4px;white-space:pre-wrap}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:999px;border:1px solid currentColor;color:var(--brass)}
.badge.cashed{color:var(--ok)} .badge.returned{color:var(--stamp)} .badge.cancelled{color:var(--muted)}
.warn{font-size:.78rem;color:var(--stamp);font-weight:600;margin-inline-start:8px}
.soon{color:var(--brass)}
.slip.transfer{border-inline-start:4px solid var(--stamp)}
.ttag{display:inline-block;font-size:.72rem;font-weight:600;color:#fff;background:var(--stamp);border-radius:4px;padding:1px 8px;margin-inline-end:8px;vertical-align:middle}
@media (prefers-color-scheme: dark){.ttag{color:#1A0F14}}
.slip.is-cancelled .amt{text-decoration:line-through;opacity:.6}
.acts{display:flex;gap:4px}
.acts button{background:transparent;border:0;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:.85rem}
.acts button:hover{background:var(--paper);color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty p{margin:0 0 12px}

dialog{border:0;border-radius:10px;padding:0;width:min(560px,94vw);background:var(--slip);color:var(--text);box-shadow:0 18px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,20,15,.55)}
.dlg-head{padding:14px 20px;font-family:var(--serif);font-size:1.5rem;font-weight:700}
form.f-form{padding:18px 20px 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.dwrap{display:flex;gap:6px;position:relative}
.dwrap .dtext{flex:1;min-width:0;direction:ltr;text-align:start}
.dpick{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:0 10px;cursor:pointer;font-size:1rem}
.dnative{position:absolute;inset-inline-end:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.bad{border-color:var(--stamp)!important;background:rgba(158,43,37,.06)!important}
#bulk{width:min(900px,96vw)}
.bulk-shared{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin-bottom:12px}
.bulk-rows{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:2px}
.brow{display:grid;grid-template-columns:minmax(150px,1.1fr) 1.5fr .9fr .8fr 1.1fr auto;gap:8px;align-items:center}
.brow input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
.brow .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px 6px}
.bhead{display:grid;grid-template-columns:minmax(150px,1.1fr) 1.5fr .9fr .8fr 1.1fr auto;gap:8px;font-size:.78rem;color:var(--muted);padding:0 2px}
.bulk-tools{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.bulk-hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.btn:disabled{opacity:.45;cursor:default}
@media (max-width:640px){.bulk-shared{grid-template-columns:1fr}.brow,.bhead{grid-template-columns:1fr 1fr}.bhead{display:none}.brow .x{justify-self:end}}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.f{margin-bottom:12px}
.grid .f{margin-bottom:0}
.f input,.f select,.f textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
.f .big{font-family:var(--serif);font-size:1.4rem;font-weight:700;padding:4px 12px}
.amount-row{display:flex;gap:8px}.amount-row select{width:84px;flex:none}
.err{color:var(--stamp);font-size:.9rem;min-height:1.4em;margin:10px 0 0}
.ok-msg{color:var(--ok)}
.dlg-acts{display:flex;gap:10px;justify-content:flex-start;margin-top:8px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--paper);padding:10px 18px;border-radius:8px;transition:.25s;pointer-events:none;z-index:20}

/* ===== שיקים נכנסים ===== */
#inApp{
  --ink:#0F3D3E; --ink-2:#1C6264; --paper:#ECF3F2; --slip:#FAFDFC; --brass:#A57B2C;
  --text:#142626; --muted:#586E6D; --line:#D0DEDC; --stamp:#A3302A; --ok:#2E6B4E; --blue:#1F6E8C;
  --serif:'Frank Ruhl Libre','David',serif; --sans:'Heebo','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){#inApp{--paper:#0B1615;--slip:#13211F;--text:#E3EEEC;--muted:#93AAA7;--line:#26403D;--ink:#082322;--ink-2:#63B8B4;--brass:#D1AB60;--stamp:#E5736C;--ok:#74C49E;--blue:#7FC3D6;color-scheme:dark}}
#inApp html{min-height:100%}
#inApp button,#inApp input,#inApp select,#inApp textarea{font:inherit;color:inherit}
#inApp .wrap{max-width:900px;margin:0 auto}
#inApp .ink{background-color:var(--ink);color:#EAF4F3;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 9px)}
#inApp /* login */
#authView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px}
#inApp /* header */
header.top{position:relative;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 22px}
#inApp .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#inApp h1.title{font-family:var(--serif);font-weight:700;font-size:2.3rem;margin:0;line-height:1.15}
#inApp .sub{color:#BFDCD8;margin:2px 0 16px;font-size:.95rem}
#inApp .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#inApp .out{background:transparent;border:1px solid rgba(255,255,255,.3);color:#EAF4F3;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap}
#inApp .out-save{background:#E9D7A6!important;color:#0F3D3E!important;border-color:#E9D7A6!important;font-weight:600}
#inApp .fs{margin:-8px 0 14px;font-size:.82rem;color:#BFDCD8;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#inApp .fs:empty{display:none}
#inApp .dot{width:8px;height:8px;border-radius:50%;background:#7BD4A6;display:inline-block}
#inApp .dot.off{background:#E4A35A}
#inApp .fs button{background:none;border:0;color:#E9D7A6;text-decoration:underline;cursor:pointer;padding:0;font-size:.82rem}
#inApp .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:8px;overflow:hidden}
#inApp .stat{background:var(--ink);padding:12px 14px}
#inApp .stat b{display:block;font-family:var(--serif);font-size:1.45rem;color:#E9D7A6;line-height:1.35;direction:ltr;text-align:start}
#inApp .stat span{font-size:.82rem;color:#BFDCD8}
#inApp .stat small{display:block;font-size:.75rem;opacity:.85}
#inApp main{padding:18px 20px 60px}
#inApp .alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
#inApp .alerts:empty{display:none}
#inApp .al{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--slip);font-size:.93rem}
#inApp .al.today{border-inline-start:4px solid var(--brass)}
#inApp .al.week{border-inline-start:4px solid var(--blue)}
#inApp .al.ret{border-color:var(--stamp);border-inline-start:4px solid var(--stamp)}
#inApp .al button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.82rem}
#inApp .bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#inApp .search{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--slip)}
#inApp .btn{border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:600;white-space:nowrap}
#inApp .btn:disabled{opacity:.45;cursor:default}
#inApp .btn-main{background:var(--ink-2);color:#fff}
@media (prefers-color-scheme: dark){#inApp .btn-main{color:#0B1615}}
#inApp .btn-ghost{background:transparent;border:1px solid var(--line)}
#inApp .btn-wa{background:#1F8F55;color:#fff}
#inApp .btn-wide{width:100%;margin-top:6px}
#inApp .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
#inApp .tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;white-space:nowrap;cursor:pointer;font-size:.9rem}
#inApp .tab[aria-pressed="true"]{background:var(--text);color:var(--paper);border-color:var(--text)}
#inApp .tab small{opacity:.7;margin-inline-start:4px}
#inApp .months{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px}
#inApp .mchip{flex:none;border:1px solid var(--line);background:var(--slip);border-radius:8px;padding:6px 12px;cursor:pointer;text-align:center;line-height:1.3;min-width:92px}
#inApp .mchip b{display:block;font-family:var(--serif);font-size:1.02rem}
#inApp .mchip span{display:block;font-size:.75rem;color:var(--muted)}
#inApp .mchip.past{opacity:.6}
#inApp .mchip.cur{border-color:var(--brass)}
#inApp .mchip.all{position:sticky;inset-inline-start:0;z-index:1}
#inApp .mchip[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:#fff;opacity:1}
#inApp .mchip[aria-pressed="true"] span{color:inherit;opacity:.85}
@media (prefers-color-scheme: dark){#inApp .mchip[aria-pressed="true"]{color:#0B1615}}
#inApp .month{font-family:var(--serif);font-size:1.3rem;font-weight:700;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:4px;flex-wrap:wrap}
#inApp .month span{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--muted)}
#inApp .slip{display:grid;grid-template-columns:92px 1fr;background:var(--slip);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
#inApp .slip.st-returned{border-inline-start:4px solid var(--stamp)}
#inApp .slip.st-passed{border-inline-start:4px solid var(--blue)}
#inApp .slip.flash{box-shadow:0 0 0 3px var(--brass);transition:box-shadow .6s}
#inApp .stub{border-inline-end:2px dashed var(--line);padding:12px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center}
#inApp .stub .d{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1}
#inApp .stub .m{font-size:.8rem;color:var(--muted)}
#inApp .stub .no{font-size:.75rem;color:var(--muted);margin-top:6px;direction:ltr}
#inApp .body{padding:12px 16px;min-width:0}
#inApp .row1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#inApp .chips{display:flex;flex-wrap:wrap;gap:6px;max-height:42vh;overflow:auto;margin-top:10px}
#inApp #in-passChips{max-height:180px}
#inApp .chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
#inApp .chip:hover{border-color:var(--ink-2);color:var(--ink-2)}
#inApp .ptag{display:inline-block;font-size:.74rem;font-weight:600;border-radius:4px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
#inApp .ptag.p-debt{background:#FBEBD3;border-color:#E9C98F;color:#7A5413}
#inApp .ptag.p-purchase{background:#D6EEEC;border-color:#9FCFCB;color:#155A57}
#inApp .cust{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
#inApp .amt{font-family:var(--serif);font-size:1.6rem;font-weight:700;white-space:nowrap;direction:ltr}
#inApp .meta{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
#inApp .meta b{color:var(--text);font-weight:600}
#inApp .notes{font-size:.86rem;margin-top:4px;white-space:pre-wrap}
#inApp .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
#inApp .badge{font-size:.78rem;padding:2px 10px;border-radius:999px;border:1px solid currentColor;color:var(--brass)}
#inApp .badge.deposited{color:var(--blue)}
#inApp .badge.passed{color:var(--blue)}
#inApp .badge.cleared{color:var(--ok)}
#inApp .badge.returned{color:var(--stamp)}
#inApp .badge.cancelled{color:var(--muted)}
#inApp .warn{font-size:.78rem;color:var(--stamp);font-weight:600;margin-inline-start:8px}
#inApp .warn.soon{color:var(--brass)}
#inApp .sent{font-size:.78rem;color:var(--ok);margin-inline-start:8px}
#inApp .acts2{display:flex;gap:2px;flex-wrap:wrap}
#inApp .acts2 button{background:transparent;border:0;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:.85rem}
#inApp .acts2 button:hover{background:var(--paper);color:var(--text)}
#inApp .acts2 button.wa{color:#fff;background:#1F8F55}
#inApp .empty{text-align:center;color:var(--muted);padding:48px 12px}
#inApp .empty p{margin:0 0 12px}
#inApp dialog{border:0;border-radius:10px;padding:0;width:min(620px,95vw);background:var(--slip);color:var(--text);box-shadow:0 18px 50px rgba(0,0,0,.35)}
#inApp dialog::backdrop{background:rgba(8,16,26,.55)}
#inApp .dlg-head{padding:14px 20px;font-family:var(--serif);font-size:1.45rem;font-weight:700}
#inApp .ff{padding:18px 20px 20px}
#inApp .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
#inApp .full{grid-column:1/-1}
#inApp .sec-t{grid-column:1/-1;font-size:.78rem;font-weight:600;letter-spacing:.02em;color:var(--brass);margin:6px 0 -6px;border-top:1px solid var(--line);padding-top:10px}
#inApp label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
#inApp .f input,#inApp .f select,#inApp .f textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
#inApp .f .big{font-family:var(--serif);font-size:1.4rem;font-weight:700;padding:4px 12px}
#inApp .amount-row{display:flex;gap:8px}
#inApp .amount-row select{width:84px;flex:none}
#inApp .dwrap{display:flex;gap:6px;position:relative}
#inApp .dwrap .dtext{flex:1;min-width:0;direction:ltr;text-align:start}
#inApp .dpick{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:0 10px;cursor:pointer}
#inApp .dnative{position:absolute;inset-inline-end:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
#inApp .bad{border-color:var(--stamp)!important;background:rgba(163,48,42,.06)!important}
#inApp .err{color:var(--stamp);font-size:.9rem;min-height:1.4em;margin:10px 0 0}
#inApp .dlg-acts{display:flex;gap:10px;justify-content:flex-start;margin-top:8px;flex-wrap:wrap}
#inApp .msg-langs{display:flex;gap:6px;margin-bottom:8px}
#inApp .msg-langs button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 10px;cursor:pointer}
#inApp .msg-langs button[aria-pressed="true"]{background:var(--text);color:var(--paper)}
#inApp #in-msgText{width:100%;min-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
#inApp .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--paper);padding:10px 18px;border-radius:8px;transition:.25s;pointer-events:none;z-index:20;max-width:92vw;text-align:center}
#inApp .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:600px){#inApp h1.title{font-size:1.9rem}#inApp .stats{grid-template-columns:1fr}#inApp .grid{grid-template-columns:1fr}#inApp .slip{grid-template-columns:72px 1fr}#inApp .amt{font-size:1.35rem}#inApp .row1{flex-direction:column;gap:0}}
@media (prefers-reduced-motion: reduce){#inApp .toast,#inApp .slip.flash{transition:none}}
</style>
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<section id="authView" class="guilloche" hidden>
  <div class="auth-card">
    <div class="auth-head guilloche">
      <div class="auth-lang"><select class="langSel" id="langSel1" aria-label="Language"><option value="he">עברית</option><option value="ar">العربية</option><option value="en">English</option></select></div>
      <h1 data-i18n="app">פנקס שיקים</h1>
      <p data-i18n="tagline">כל שיק שיוצא, למי ומאיזה חשבון</p>
    </div>

    <div id="authBox">
      <div class="auth-tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-mode="login" data-i18n="login">כניסה</button>
        <button type="button" role="tab" aria-selected="false" data-mode="signup" data-i18n="signup">משתמש חדש</button>
      </div>
      <form class="auth-body" id="authForm" method="post" action="#" autocomplete="on" novalidate>
        <div class="f" id="nameField" hidden><label for="aName" data-i18n="name">שם</label><input id="aName" autocomplete="name"></div>
        <div class="f"><label for="aUser" data-i18n="username">שם משתמש</label><input id="aUser" autocomplete="username" dir="ltr" autocapitalize="none" spellcheck="false"></div>
        <div class="f"><label for="aPass" data-i18n="password">סיסמה</label><input id="aPass" type="password" autocomplete="current-password" dir="ltr"></div>
        <button class="btn btn-main btn-wide" id="authBtn" type="submit">כניסה</button>
        <p class="err" id="authErr" role="alert"></p>
        <p class="hint" data-i18n="hint"></p>
      </form>
    </div>
  </div>
</section>

<!-- ===== التطبيق ===== -->
<div id="appView" hidden>
  <nav class="modebar" id="modebar"><button type="button" data-mode="out" data-i18n="mode_out"></button><button type="button" data-mode="in" data-i18n="mode_in"></button><button type="button" data-mode="lim" data-i18n="mode_lim"></button><button type="button" data-mode="arch" data-i18n="mode_arch"></button></nav>
  <div id="outApp">
  <header class="top guilloche">
    <div class="wrap">
      <div class="head-row">
        <h1 class="title" id="appTitle"></h1>
        <div class="head-acts">
          <button class="out out-save" id="fileBtn" data-i18n="save_pc"></button>
          <button class="out" id="cloudBtn" data-i18n="cl_btn"></button>
          <button class="out" id="backupBtn" data-i18n="backup"></button>
          <button class="out" id="restoreBtn" data-i18n="restore"></button>
          <button class="out" id="wipeBtn" data-i18n="wipe"></button>
          <button class="out" id="logoutBtn" data-i18n="logout"></button>
          <select class="langSel" id="langSel2" aria-label="Language"><option value="he">עברית</option><option value="ar">العربية</option><option value="en">English</option></select>
          <input type="file" id="restoreFile" accept="application/json,.json" hidden>
        </div>
      </div>
      <p class="sub" data-i18n="tagline"></p>
      <p class="fs" id="fsStatus"></p>
      <p class="fs" id="cloudStatus"></p>
      <p class="ver" data-i18n="ver"></p>
      <div class="stats">
        <div class="stat"><b id="sPending">—</b><span data-i18n="st_pending"></span></div>
        <div class="stat"><b id="sSoon">—</b><span id="sSoonLbl"></span></div>
        <div class="stat"><b id="sReturned">—</b><span data-i18n="st_returned"></span></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="alerts" id="alerts" role="status"></div>
    <div class="sections" id="sections" role="toolbar" aria-label="קבוצות"></div>
    <div class="bar">
      <input class="search" id="q" type="search" data-i18n-ph="search_ph">
      <label class="zoom" data-i18n-title="size"><span class="zs">A</span><input type="range" id="zoom" min="55" max="130" step="5" value="100"><span class="zl">A</span><output id="zoomVal">100%</output></label>
      <button class="btn btn-ghost" id="undoBtn" data-i18n="undo" data-i18n-title="undo_t"></button>
      <button class="btn btn-ghost" id="redoBtn" data-i18n="redo" data-i18n-title="redo_t"></button>
      <button class="btn btn-ghost" id="repBtn" data-i18n="rep_btn"></button>
      <button class="btn btn-ghost" id="bulkBtn" data-i18n="bulk_btn"></button>
      <button class="btn btn-main" id="newBtn" data-i18n="new_cheque"></button>
    </div>
    <div class="months arc-years" id="arcYears" hidden></div>
    <div class="tabs" id="tabs" role="toolbar" aria-label="סינון לפי סטטוס"></div>
    <div class="months" id="months" role="toolbar" aria-label="חודשים"></div>
    <div id="list"><p class="empty" data-i18n="loading"></p></div>
  </main>
  </div>
  <div id="limApp" hidden>
    <header class="top guilloche"><div class="wrap">
      <h1 class="title" data-i18n="lim_title"></h1>
      <p class="sub" data-i18n="lim_sub"></p>
    </div></header>
    <main class="wrap">
      <div class="lim-top">
        <div class="f"><label for="limDef" data-i18n="lim_def"></label><input id="limDef" type="number" inputmode="numeric" min="0" step="100" placeholder="—"></div>
        <div class="lim-nav"><button type="button" class="btn btn-ghost" id="limPrev">›</button><b id="limMonthLbl"></b><button type="button" class="btn btn-ghost" id="limNext">‹</button></div>
        <button type="button" class="btn btn-ghost" id="limFill" data-i18n="lim_fill"></button>
      </div>
      <p class="bulk-hint" data-i18n="lim_hint"></p>
      <div class="lim-grid" id="limGrid"></div>
    </main>
  </div>
  <div id="inApp" hidden>


<div id="in-appView">
  <header class="top ink">
    <div class="wrap">
      <div class="head-row">
        <h1 class="title" id="in-appTitle"></h1>
        <div class="acts">
          <button class="out out-save" id="in-fileBtn" data-in="save_pc"></button>
          <button class="out" id="in-smsBtn" data-in="sms_btn"></button>
          <button class="out" id="in-backupBtn" data-in="backup"></button>

          <input type="file" id="in-restoreFile" accept="application/json,.json" hidden>

      <p class="sub" data-in="tagline"></p>
      <p class="fs" id="in-fsStatus"></p>
      <div class="stats">
        <div class="stat"><b id="in-sHeld">—</b><span data-in="st_held"></span></div>
        <div class="stat"><b id="in-sMonth">—</b><span id="in-sMonthLbl"></span></div>
        <div class="stat"><b id="in-sRet">—</b><span id="in-sRetLbl"></span></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="alerts" id="in-alerts"></div>
    <div class="bar">
      <input class="search" id="in-q" type="search" data-in-ph="search_ph">
      <button class="btn btn-ghost" id="in-undoBtn" data-in="undo" data-in-title="undo_t"></button>
      <button class="btn btn-ghost" id="in-redoBtn" data-in-title="redo_t">↷</button>
      <button class="btn btn-main" id="in-newBtn" data-in="new_cheque"></button>
    </div>
    <div class="tabs" id="in-tabs" role="toolbar"></div>
    <div class="months" id="in-months" role="toolbar"></div>
    <div id="in-list"></div>
  </main>
</div>

<!-- cheque form -->
<dialog id="in-dlg">
  <div class="dlg-head ink" id="in-dlgTitle"></div>
  <form class="ff" id="in-form" novalidate>

function updUndo(){ const u = $('#undoBtn'), r = $('#redoBtn'); if(u) u.disabled = !undoStack.length; if(r) r.disabled = !redoStack.length; }
function applyState(str){ const st = JSON.parse(str); checks = st.checks; writeJSON(K_DATA(user.username), checks); writeJSON(K_GROUPS(user.username), st.groups || []); curState = str; scheduleAutoSave(); render(); updUndo(); }
function undo(){ if(!user) return; if(!undoStack.length) return toast(t('nothing_undo')); redoStack.push(curState); applyState(undoStack.pop()); toast(t('undone')); }

async function perm(h, ask){ try{ let p = await h.queryPermission({mode:'readwrite'}); if(p !== 'granted' && ask) p = await h.requestPermission({mode:'readwrite'}); return p === 'granted'; }catch(e){ return false; } }

function newId(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }

async function hashPass(pass, salt){
  const data = new TextEncoder().encode(salt + ':' + pass);
  if(!(crypto && crypto.subtle)) return btoa(unescape(encodeURIComponent(salt + pass)));
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ---------- תאריכים: הקלדה או לוח שנה ---------- */
function parseDate(str){
  str = String(str || '').trim(); if(!str) return '';
  let y, m, d, x;
  if((x = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, m, d] = x;
  else if((x = str.match(/^(\d{1,2})[\/.\-\s](\d{1,2})[\/.\-\s](\d{2}|\d{4})$/))) [, d, m, y] = x;
  else if((x = str.match(/^(\d{2})(\d{2})(\d{4})$/))) [, d, m, y] = x;
  else if((x = str.match(/^(\d{2})(\d{2})(\d{2})$/))) [, d, m, y] = x;
  else return null;
  y = +y; m = +m; d = +d; if(y < 100) y += 2000;
  const dt = new Date(y, m - 1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
const fmtDate = ymd => ymd ? ymd.slice(8,10) + '/' + ymd.slice(5,7) + '/' + ymd.slice(0,4) : '';
function addMonth(ymd, day){ const [y,m,d0] = ymd.split('-').map(Number); const d = day || d0; const last = new Date(y, m + 1, 0).getDate(); const dt = new Date(y, m, Math.min(d, last)); return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }

});

/* ---------- أدوات ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n).toLocaleString('en-US',{maximumFractionDigits:2}); }
function money(n, cur){ return cur + ' ' + fmt(n); }
function todayYmd(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysUntil(ymd){ return Math.round((new Date(ymd+'T00:00:00') - new Date(todayYmd()+'T00:00:00'))/864e5); }
function sumText(list){
  if(!list.length) return '0';
  const by = {}; list.forEach(c => by[c.currency] = (by[c.currency]||0) + c.amount);
  return Object.entries(by).map(([cur,v]) => money(v,cur)).join(' + ');
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = $('#aUser').value.trim().toLowerCase();
  const pass = $('#aPass').value, name = $('#aName').value.trim();
  const errEl = $('#authErr');
  if(!username) return errEl.textContent = t('err_user');
  if(!/^[a-z0-9._-]{3,30}$/.test(username)) return errEl.textContent = t('err_user_fmt');
  if(pass.length < 4) return errEl.textContent = t('err_pass');
  const accs = accounts();
  if(authMode === 'signup'){
    if(!name) return errEl.textContent = t('err_name');
    if(accs[username]) return errEl.textContent = t('err_exists');
    const salt = newId();
    accs[username] = {name, salt, hash: await hashPass(pass, salt), created: new Date().toISOString()};
    if(!writeJSON(K_ACCOUNTS, accs)) return;
    offerSave(username, pass, name || (accounts()[username]||{}).name);
    login(username);
  } else {
    const a = accs[username];
    if(!a || a.hash !== await hashPass(pass, a.salt)) return errEl.textContent = t('err_login');
    offerSave(username, pass, name || (accounts()[username]||{}).name);
    login(username);
  }
});

/* ---------- ימים שהבנק סגור: שישי, שבת וחגים ---------- */
const HEB = (() => { try{ return new Intl.DateTimeFormat('en-u-ca-hebrew', {day:'numeric', month:'long', timeZone:'UTC'}); }catch(_){ return null; } })();
const HOL_NAMES = {
  rh:{he:'ראש השנה', ar:'رأس السنة العبرية', en:'Rosh Hashana'}, yk:{he:'יום כיפור', ar:'يوم الغفران', en:'Yom Kippur'},
  sk:{he:'סוכות', ar:'عيد العرش', en:'Sukkot'}, st:{he:'שמחת תורה', ar:'فرحة التوراة', en:'Simchat Torah'},
  ps:{he:'פסח', ar:'عيد الفصح', en:'Passover'}, ps7:{he:'שביעי של פסח', ar:'آخر الفصح', en:'Passover (7th day)'},
  sv:{he:'שבועות', ar:'عيد الأسابيع', en:'Shavuot'}, ind:{he:'יום העצמאות', ar:'يوم الاستقلال', en:'Independence Day'},
  fri:{he:'שישי', ar:'جمعة', en:'Friday'}, sat:{he:'שבת', ar:'سبت', en:'Saturday'}
};
const holCache = {};
function hebOf(ymd){ if(!HEB) return null; const p = HEB.formatToParts(new Date(ymd + 'T12:00:00Z')); return {d: +p.find(x => x.type === 'day').value, m: p.find(x => x.type === 'month').value}; }
function closedReason(ymd){
  if(ymd in holCache) return holCache[ymd];
  const wd = new Date(ymd + 'T12:00:00Z').getUTCDay(); let r = null;
  const h = null;   // חגים: הבנק פתוח לאבא — רק שישי ושבת נחשבים סגורים
  if(h){
    if(h.m === 'Tishri' && (h.d === 1 || h.d === 2)) r = 'rh';
    else if(h.m === 'Tishri' && h.d === 10) r = 'yk';
    else if(h.m === 'Tishri' && h.d === 15) r = 'sk';
    else if(h.m === 'Tishri' && h.d === 22) r = 'st';
    else if(h.m === 'Nisan' && h.d === 15) r = 'ps';
    else if(h.m === 'Nisan' && h.d === 21) r = 'ps7';
    else if(h.m === 'Sivan' && h.d === 6) r = 'sv';
    else if(h.m === 'Iyar' && h.d >= 3 && h.d <= 6){
      // יום העצמאות: ה' באייר, מוקדם לחמישי אם נופל בשישי/שבת, נדחה לשלישי אם נופל בשני
      const base = addDays(ymd, 5 - h.d), bwd = new Date(base + 'T12:00:00Z').getUTCDay();
      const real = bwd === 5 ? addDays(base, -1) : bwd === 6 ? addDays(base, -2) : bwd === 1 ? addDays(base, 1) : base;
      if(real === ymd) r = 'ind';
    }
  }
  // שישי ושבת: לפי בקשה — ימים רגילים, לא נחשבים סגורים
  return holCache[ymd] = r;
}
const closedName = ymd => { const r = closedReason(ymd); return r ? (HOL_NAMES[r][LANG] || HOL_NAMES[r].he) : ''; };
// היום שבו השיק באמת ייפרע (היום עצמו, או יום העסקים הבא)
function effDate(ymd){ let d = ymd; for(let i = 0; i < 10 && closedReason(d); i++) d = addDays(d, 1); return d; }
const WDN = {he:['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'], ar:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'], en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']};
const wdName = ymd => (WDN[LANG] || WDN.he)[new Date(ymd + 'T12:00:00Z').getUTCDay()];
function closedMsg(ymd){ const e = effDate(ymd); return t('closed_msg', {x: closedName(ymd), d: wdName(e) + ' ' + fmtDate(e)}); }
// הודעה חיה מתחת לשדה התאריך
function dueHint(inp, hintEl){
  const v = parseDate(inp.value); if(!v){ hintEl.textContent = ''; return; }
  let msg = closedReason(v) ? closedMsg(v) : '';
  const e = effDate(v); const lim = limitFor(e);
  if(lim !== null){ const left = Math.max(0, lim - usedOn(e, editingId)); msg += (msg ? ' • ' : '') + t('lim_left_day', {f: fmtShek(left)}); }

function limitFor(ymd){ const L = limData(); const v = L.days[ymd]; return v !== undefined && v !== null && v !== '' ? +v : (L.def !== null && L.def !== '' && L.def !== undefined ? +L.def : null); }
const COUNTS = ['بانتظار الصرف','انصرف'];
function usedOn(ymd, excludeId){ return checks.filter(c => effDate(c.dueDate) === ymd && c.id !== excludeId && COUNTS.includes(c.status)).reduce((s, c) => s + c.amount, 0); }
// בודק אם אפשר להוסיף סכום ביום מסוים. מחזיר null אם בסדר, או את פרטי החריגה
function overLimit(ymd, amount, excludeId, extra = 0){
  ymd = effDate(ymd);
  const lim = limitFor(ymd); if(lim === null) return null;
  const used = usedOn(ymd, excludeId) + extra;
  return used + amount > lim ? {lim, used, left: Math.max(0, lim - used)} : null;
}
function freeDays(from, amount, excludeId, n = 4){
  const out = []; for(let i = 1; i <= 90 && out.length < n; i++){ const d = addDays(from, i); if(!closedReason(d) && !overLimit(d, amount, excludeId)) out.push(d); }
  return out;
}

const K_CLOUD = () => 'ffcheques:cloud:' + user.username;

const cloudUrl = () => (readJSON('ffincheq:sms:' + user.username, {}).relay || 'https://sms-relay.mhmdsydkbha.workers.dev').trim().replace(/\/+$/, '');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function sha256hex(str){ const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join(''); }
const cloudId = (u, pass) => sha256hex('ff-cheques-cloud-v1:' + u + ':' + pass);
async function aesKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptStr(pass, text){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await aesKey(pass, salt), new TextEncoder().encode(text));
  return JSON.stringify({v:1, s:b64(salt), i:b64(iv), c:b64(ct)});
}
async function decryptStr(pass, payload){
  const p = JSON.parse(payload);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(p.i)}, await aesKey(pass, unb64(p.s)), unb64(p.c));
  return new TextDecoder().decode(pt);
}
const cloudSnapshot = () => JSON.stringify({checks, groups: savedGroups(), limits: limData(), incoming: readJSON('ffincheq:data:' + user.username, [])});
async function cloudUpload(force){
  if(!user) return false;
  const c = cloudCfg(); if(!c.on || !c.pass) return false;
  const snap = cloudSnapshot(); const h = await sha256hex(snap);
  if(!force && h === c.hash) return true;                     // אין שינוי מאז הגיבוי האחרון
  try{
    const data = await encryptStr(c.pass, JSON.stringify({app:'cheques-cloud', at:new Date().toISOString(), name:user.name, ...JSON.parse(snap)}));
    const res = await fetch(cloudUrl() + '/backup/save', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: await cloudId(user.username, c.pass), data})});
    if(!res.ok){ const j = await res.json().catch(() => ({})); throw new Error(j.message || ('HTTP ' + res.status)); }
    writeJSON(K_CLOUD(), {...c, last: Date.now(), hash: h}); cloudStatus(); return true;
  }catch(e){ cloudStatus(e.message); return false; }
}
function cloudStatus(err){
  const el = $('#cloudStatus'); if(!el || !user) return;
  const c = cloudCfg();
  if(!c.on){ el.innerHTML = ''; return; }
  el.innerHTML = err ? `<span class="dot off"></span>${esc(t('cl_err', {e: err}))}` : `<span class="dot"></span>${esc(t('cl_ok'))}${c.last ? ' • ' + fmtDate(new Date(c.last).toISOString().slice(0,10)).slice(0,5) + ' ' + hhmm(new Date(c.last)) : ''}`;
}
setInterval(() => cloudUpload(false), 5 * 60 * 1000);
$('#cloudBtn').addEventListener('click', () => {
  const c = cloudCfg(); $('#clPass').value = c.pass || ''; $('#clPass2').value = c.pass || ''; $('#clOn').checked = !!c.on;
  $('#clMsg').style.color = ''; $('#clMsg').textContent = c.last ? t('cl_last', {d: fmtDate(new Date(c.last).toISOString().slice(0,10)) + ' ' + hhmm(new Date(c.last))}) : '';
  $('#cloudDlg').showModal();
});
$('#clCancel').addEventListener('click', () => $('#cloudDlg').close());
$('#clForm').addEventListener('submit', async e => {
  e.preventDefault(); const m = $('#clMsg'); m.style.color = '';
  const p = $('#clPass').value, p2 = $('#clPass2').value, on = $('#clOn').checked;
  if(on && p.length < 6) return m.textContent = t('cl_short');
  if(on && p !== p2) return m.textContent = t('cl_mismatch');
  writeJSON(K_CLOUD(), {...cloudCfg(), pass: p, on, hash: ''});
  if(on){ m.textContent = t('cl_saving'); if(!(await cloudUpload(true))) return m.textContent = t('cl_err', {e: ''}); }
  $('#cloudDlg').close(); cloudStatus(); toast(on ? t('cl_done') : t('rem_saved'));
});
$('#clRestore').addEventListener('click', async () => {
  const m = $('#clMsg'); m.style.color = ''; const p = $('#clPass').value;
  if(!p) return m.textContent = t('cl_need_pass');
  m.textContent = t('cl_loading');
  try{
    const res = await fetch(cloudUrl() + '/backup/load', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: await cloudId(user.username, p)})});
    if(res.status === 404) return m.textContent = t('cl_notfound');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json(); let d;
    try{ d = JSON.parse(await decryptStr(p, j.data)); }catch(_){ return m.textContent = t('cl_badpass'); }
    if(!confirm(t('cl_confirm', {n: (d.checks || []).length, d: fmtDate((d.at || '').slice(0,10))}))) return m.textContent = '';
    const ids = new Set(checks.map(c => c.id)); let added = 0;
    (d.checks || []).forEach(c => { if(!ids.has(c.id)){ checks.push(c); added++; } });
    if(Array.isArray(d.groups)) saveGroups([...new Set([...savedGroups(), ...d.groups])]);
    if(d.limits && d.limits.days){ const L = limData(); if(L.def === null) L.def = d.limits.def ?? null; Object.entries(d.limits.days).forEach(([k,v]) => { if(L.days[k] === undefined) L.days[k] = v; }); writeJSON(K_LIM(), L); }
    if(Array.isArray(d.incoming)){ const cur = readJSON('ffincheq:data:' + user.username, []); const iid = new Set(cur.map(x => x.id)); d.incoming.forEach(x => { if(!iid.has(x.id)) cur.push(x); }); writeJSON('ffincheq:data:' + user.username, cur); }
    writeJSON(K_CLOUD(), {...cloudCfg(), pass: p, on: true, hash: ''});
    persist(); m.style.color = 'var(--ok)'; m.textContent = t('cl_restored', {n: added});
    setTimeout(() => location.reload(), 1500);
  }catch(e){ m.textContent = t('cl_err', {e: e.message}); }
});

/* ---------- מסך פתיחה: השיקים של היום ומחר ---------- */
function showDaySummary(){
  if(!user || sessionStorage.getItem('ffcheques:autoReload')){ sessionStorage.removeItem('ffcheques:autoReload'); return; }
  const pend = checks.filter(c => c.status === 'بانتظار الصرف');
  const td = todayYmd(), tm = addDays(td, 1);
  const fill = (list, sumEl, listEl) => {
    $(sumEl).innerHTML = list.length ? `${sumText(list)}<span>${list.length} ${t('cheques')}</span>` : `<span>${t('day_none')}</span>`;
    $(listEl).innerHTML = list.sort((a,b) => b.amount - a.amount).map(c => `<li><span>${esc(c.payee)}${TRANSFER_RE.test(c.bank||'') ? `<em>${esc(t('transfers'))}</em>` : ''}</span><b>${esc(money(c.amount, c.currency))}</b></li>`).join('');
  };
  fill(pend.filter(c => c.dueDate === td), '#dayTodaySum', '#dayTodayList');
  fill(pend.filter(c => c.dueDate === tm), '#dayTomSum', '#dayTomList');
  $('#dayTodayDate').textContent = fmtDate(td); $('#dayTomDate').textContent = fmtDate(tm);
  const late = pend.filter(c => c.dueDate < td);
  $('#dayLate').textContent = late.length ? t('day_late', {n: late.length, s: sumText(late)}) : '';
  if(!$('#dayDlg').open) $('#dayDlg').showModal();
}
$('#dayClose').addEventListener('click', () => $('#dayDlg').close());
$('#dayDlg').addEventListener('click', e => {
  const b = e.target.closest('[data-day]'); if(!b) return;
  $('#dayDlg').close(); setAppMode('out'); section = '__all'; filter = 'بانتظار الصرف'; $('#q').value = '';
  const k = b.dataset.day === 'today' ? todayYmd() : addDays(todayYmd(), 1);
  monthSel = k.slice(0,7); render();
  const el = [...$('#list').querySelectorAll('.slip')].find(x => { const c = checks.find(i => i.id === x.dataset.cid); return c && c.dueDate === k && c.status === 'بانتظار الصرف'; });
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800); }
});

/* ---------- ריענון אוטומטי כל חצי שעה ---------- */
(function autoRefresh(){
  const EVERY = 30 * 60 * 1000;
  const tryReload = () => {
    const busy = document.querySelector('dialog[open]:not(#dayDlg)') || ['INPUT','TEXTAREA','SELECT'].includes((document.activeElement || {}).tagName);
    if(busy){ setTimeout(tryReload, 60 * 1000); return; }     // באמצע עבודה: מחכה דקה ומנסה שוב
    sessionStorage.setItem('ffcheques:autoReload', '1');
    location.reload();
  };
  setTimeout(tryReload, EVERY);
})();

$('#wipeBtn').addEventListener('click', () => {
  if(!checks.length) return toast(t('none_at_all'));
  const typed = prompt(t('wipe_prompt',{n:checks.length, w:t('wipe_word')}));
  if((typed || '').trim().toUpperCase() !== t('wipe_word').toUpperCase()) return toast(t('wipe_none'));
  checks = []; writeJSON(K_GROUPS(user.username), []); persist(); section = ''; monthSel = '';
  render(); toast(t('wipe_done'));

$('#restoreFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.checks;
    if(data && data.limits && data.limits.days){ const L = limData(); if(L.def === null && data.limits.def !== undefined) L.def = data.limits.def; Object.entries(data.limits.days).forEach(([k,v]) => { if(L.days[k] === undefined) L.days[k] = v; }); writeJSON(K_LIM(), L); }
    if(!Array.isArray(list)) throw 0;
    const valid = list.filter(c => c && c.payee && c.dueDate && +c.amount > 0).map(c => ({rec: {...cleanRec(c), id: c.id || newId(), updated: c.updated || new Date().toISOString()}, hasGroup: !!c.group}));
    if(!confirm(t('restore_confirm',{n:valid.length}))) return;
    const byId = new Map(checks.map(c => [c.id, c]));
    let added = 0, moved = 0;
    valid.forEach(({rec: c, hasGroup}) => {
      const old = byId.get(c.id);
      if(!old){ checks.push(c); added++; }
      else if(hasGroup && old.group !== c.group && (!old.group || old.updated === c.updated)){ old.group = c.group; moved++; }   // تصليح الخانة للشيكات اللي نزلت قبل وما انعدّلت
    });
    persist(); render();
    toast(added ? t('restore_added',{n:added}) + (moved ? ', ' + t('restore_moved',{n:moved}) : '') : (moved ? t('restore_moved',{n:moved}) : t('restore_exists')));
  }catch(err){ toast(t('restore_bad')); }
});

/* ---------- العرض ---------- */
const groupOf = c => c.group || FALLBACK;
const savedGroups = () => readJSON(K_GROUPS(user.username), []);
function saveGroups(list){ writeJSON(K_GROUPS(user.username), list); commit(); scheduleAutoSave(); }
function groups(){
  const g = [...new Set([...savedGroups(), ...checks.map(groupOf)])];
  return g.length ? g : [FALLBACK];
}
function render(){
  const gs = groups();
  if(section !== '__all' && !gs.includes(section)) section = gs.length > 1 ? '__all' : gs[0];
  const vis = viewMode === 'archive' ? checks.filter(c => ARCH_ST.includes(c.status) && +c.dueDate.slice(0,4) === archYear) : checks.filter(c => c.status === 'بانتظار الصرف');
  $('#sections').innerHTML = (gs.length > 1 ? `<button class="sec" aria-pressed="${section==='__all'}" data-g="__all">${t('all_sec')}<small>${vis.length}</small></button>` : '') + gs.map(g => `<button class="sec" aria-pressed="${g===section}" data-g="${esc(g)}">${esc(g)}<small>${vis.filter(c=>groupOf(c)===g).length}</small></button>`).join('') +
    `<span class="sec-tools"><button class="sec-btn" data-gact="add" title="${t('grp_add_t')}">${t('grp_add')}</button><button class="sec-btn" data-gact="rename" title="${t('grp_ren_t')}">${t('grp_ren')}</button><button class="sec-btn" data-gact="del" title="${t('grp_del_t')}">${t('grp_del')}</button></span>`;
  $('#group').innerHTML = gs.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  const all = checks;
  const checksInSec = section === '__all' ? all : all.filter(c => groupOf(c)===section);
  renderSection(checksInSec);
}
function renderSection(checks){
  if(viewMode === 'archive') return renderArchive(checks);
  $('#outApp').classList.remove('arch-mode'); $('#arcYears').hidden = true; $('#tabs').hidden = true; filter = 'بانتظار الصرف';
  if(user) $('#appTitle').textContent = t('app') + ' ' + user.name;
  const pending = checks.filter(c => c.status==='بانتظار الصرف');
  {
    const late = pending.filter(c => daysUntil(c.dueDate) < 0);
    const today = pending.filter(c => daysUntil(c.dueDate) === 0);
    const week = pending.filter(c => { const d = daysUntil(c.dueDate); return d > 0 && d <= 7; });
    const tom = pending.filter(c => daysUntil(c.dueDate) === 1);
    const line = (cls, txt, list, act) => list.length ? `<div class="al ${cls}"><span>${txt} <b>${list.length}</b> ${t('in_total')} <b>${sumText(list)}</b></span><button data-alert="${act}">${t('show')}</button></div>` : '';
    $('#alerts').innerHTML =
      line('tom', t('al_tom', {d: fmtDate(addDays(todayYmd(), 1)).slice(0,5)}), tom, 'tom') +
      line('today', t('al_today'), today, 'today') +
      line('week', t('al_week'), week, 'week') +
      line('late', t('al_late'), late, 'late');
  }
  $('#sPending').textContent = sumText(pending);
  $('#sReturned').textContent = checks.filter(c => c.status==='راجع').length;

  $('#tabs').innerHTML = [...STATUSES,'الكل'].map(s => {
    const n = s==='الكل' ? checks.length : checks.filter(c=>c.status===s).length;
    return `<button class="tab" aria-pressed="${s===filter}" data-f="${s}">${stLabel(s)}<small>${n}</small></button>`;
  }).join('');

  const q = $('#q').value.trim().toLowerCase();
  let list = checks.filter(c => filter==='الكل' || c.status===filter);
  if(q) list = list.filter(c => [c.payee,c.number,c.bank,c.account,c.notes,String(c.amount)].join(' ').toLowerCase().includes(q));
  updateLists();

  // الأشهر: كل شهر لحال، بالأرقام
  const cur = todayYmd().slice(0,7);
  const mName = k => { const [y,m] = k.split('-'); return m + '/' + y; };
  const byMonth = {};
  list.forEach(c => { const k=c.dueDate.slice(0,7); (byMonth[k]=byMonth[k]||[]).push(c); });
  const chipMonths = Object.keys(byMonth).sort();
  if(monthSel !== 'all' && !chipMonths.includes(monthSel)){
    monthSel = chipMonths.includes(cur) ? cur : (chipMonths.find(k => k > cur) || chipMonths[chipMonths.length-1] || '');
  }
  $('#months').innerHTML = `<button class="mchip all" data-month="all" aria-pressed="${monthSel==='all'}"><b>${t('all_months')}</b><span>${t('n_cheques',{n:list.length})}</span></button>` + chipMonths.map(k => `<button class="mchip ${k<cur?'past':''} ${k===cur?'cur':''}" data-month="${k}" aria-pressed="${k===monthSel}"><b>${mName(k)}</b><span>${t('n_cheques',{n:byMonth[k].length})}</span></button>`).join('');
  const act = $('#months [aria-pressed="true"]');
  if(act) act.scrollIntoView({inline:'center', block:'nearest'});

  const isTr = c => TRANSFER_RE.test(c.bank||'');
  const split = items => { const ch = items.filter(c => !isTr(c)), tr = items.filter(isTr); return {ch, tr}; };
  const breakdown = items => {
    const {ch, tr} = split(items), parts = [];
    if(ch.length) parts.push(`${t('cheques')} ${sumText(ch)}`);
    if(tr.length) parts.push(`${t('transfers')} ${sumText(tr)}`);
    if(ch.length && tr.length) parts.push(`<b>${t('total')} ${sumText(items)}</b>`);
    return parts.join(' • ') || '0';
  };
  // הריבוע האמצעי: מה שנשאר לפירעון בחודש הנבחר (יורד כשמסמנים נפרע)
  const setMonthStat = () => {
    const inMonth = checks.filter(c => monthSel === 'all' || c.dueDate.slice(0,7) === monthSel);
    const left = inMonth.filter(c => c.status === 'بانتظار الصرف');
    const done = inMonth.filter(c => c.status === 'انصرف');
    const {ch, tr} = split(left);
    $('#sSoon').textContent = left.length ? sumText(left) : '0';
    const title = monthSel === 'all' ? t('left_all') : monthSel ? t('left_month',{m:mName(monthSel)}) : t('none');
    $('#sSoonLbl').innerHTML = `${title} (${left.length})` +
      `<small class="sub2">${[ch.length?`${t('cheques')} ${sumText(ch)}`:'', tr.length?`${t('transfers')} ${sumText(tr)}`:'', done.length?`${t('s_cashed')} ${sumText(done)}`:''].filter(Boolean).join(' • ')}</small>`;
  };
  if(!list.length){
    setMonthStat();
    $('#list').innerHTML = checks.length
      ? `<div class="empty"><p>${t('empty_sel')}</p></div>`
      : `<div class="empty"><p>${t('empty_grp')}</p><button class="btn btn-main" onclick="openForm()">${t('first_btn')}</button></div>`;
    return;
  }
  const head = (k, items) => `<div class="month">${mName(k)}${k===cur?' <small style="font-family:var(--sans);font-size:.8rem;color:var(--brass)">'+t('this_month')+'</small>':''}<span>${items.length} • ${breakdown(items)}</span></div>`;
  if(monthSel === 'all'){
    setMonthStat();
    $('#list').innerHTML = chipMonths.map(k => head(k, byMonth[k]) + byMonth[k].sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).map(slip).join('')).join('');
    return;
  }
  const items = byMonth[monthSel].sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  setMonthStat();
  $('#list').innerHTML = head(monthSel, items) + items.map(slip).join('');
}

function slip(c){
  const [,m,d] = c.dueDate.split('-');
  const left = daysUntil(c.dueDate);
  let warn = '';
  if(c.status==='بانتظار الصرف'){
    if(closedReason(c.dueDate)) warn += `<span class="ctag" title="${esc(closedMsg(c.dueDate))}">${esc(closedName(c.dueDate))} → ${esc(t('closed_tag', {d: fmtDate(effDate(c.dueDate)).slice(0,5)}))}</span>`;
    if(left < 0) warn += `<span class="warn">${t('overdue')}</span>`;
    else if(left === 0) warn += `<span class="warn">${t('due_today')}</span>`;
    else if(left <= 7) warn += `<span class="warn soon">${left===1?t('tomorrow'):t('in_days',{n:left})}</span>`;
  }
  const isT = TRANSFER_RE.test(c.bank||'');
  const where = [isT ? '' : bankHe(c.bank), c.account && (t('account') + ' ' + c.account)].filter(Boolean).join(', ');
  return `<article class="slip ${c.status==='ملغي'?'is-cancelled':''} ${isT?'transfer':''}" data-cid="${esc(c.id)}">
    <div class="stub"><div class="d">${+d}</div><div class="m">${m}/${c.dueDate.slice(0,4)}</div>${c.number?`<div class="no">#${esc(c.number)}</div>`:''}</div>
    <div class="body">
      <div class="row1"><div class="payee">${isT?`<span class="ttag">${esc(bankHe(c.bank))}</span>`:''}${esc(c.payee)}</div><div class="amt">${esc(money(c.amount,c.currency))}</div></div>
      ${where?`<div class="meta">${esc(where)}</div>`:''}
      ${c.notes?`<div class="notes">${esc(c.notes)}</div>`:''}
      <div class="foot">
        <div><span class="badge ${STATUS_CLASS[c.status]||''}">${esc(stLabel(c.status))}</span>${warn}</div>
        <div class="acts">
          ${c.status==='بانتظار الصرف'?`<button data-act="cash" data-id="${esc(c.id)}">${t('b_cash')}</button>`:''}
          ${c.status!=='راجع'&&c.status!=='ملغي'?`<button data-act="ret" data-id="${esc(c.id)}">${t('b_ret')}</button>`:''}
          ${c.status!=='بانتظار الصرف'?`<button data-act="pend" data-id="${esc(c.id)}">${t('b_pend')}</button>`:''}
          <button data-act="edit" data-id="${esc(c.id)}">${t('b_edit')}</button>
          <button data-act="del" data-id="${esc(c.id)}">${t('b_del')}</button>
        </div>
      </div>
    </div>
  </article>`;
}

function updateLists(){
  const uniq = arr => [...new Set(arr.filter(Boolean))];
  $('#payeeList').innerHTML = uniq(checks.map(c=>c.payee)).map(v=>`<option value="${esc(v)}">`).join('');
  $('#bankList').innerHTML = uniq([t('transfer_label'), ...checks.map(c=>bankHe(c.bank)), ...BANKS]).map(v=>`<option value="${esc(v)}">`).join('');
  $('#accountList').innerHTML = uniq(checks.map(c=>c.account)).map(v=>`<option value="${esc(v)}">`).join('');
}

/* ---------- الإضافة والتعديل ---------- */
// המספר הבא = אחרי השיק האחרון שהוזן (לפי סדר ההוספה), לא אחרי השיק האחרון שנערך
function suggestNo(g){
  const withNo = checks.filter(x => (x.group || FALLBACK) === g && /^\d+$/.test(x.number || '') && !TRANSFER_RE.test(x.bank || ''));
  const lastIn = withNo[withNo.length - 1];
  return lastIn ? String(+lastIn.number + 1).padStart(lastIn.number.length, '0') : '';
}
function openForm(id){
  const c = checks.find(x => x.id===id);
  editingId = c ? c.id : '';
  $('#dlgTitle').textContent = c ? t('edit_cheque') : t('new_cheque');
  $('#err').textContent = '';
  const g0 = section === '__all' ? groups()[0] : section;
  const last = [...checks].filter(x => (x.group || FALLBACK) === g0).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''))[0];
  const nextNo = c ? '' : suggestNo(g0);

function cleanRec(d){

  return {
    payee:s(d.payee), amount:Math.round(Number(d.amount)*100)/100, currency:s(d.currency,5)||'₪',
    dueDate:ymd(d.dueDate), issueDate:ymd(d.issueDate), bank:s(d.bank), account:s(d.account,60),
    number:s(d.number,40), status:STATUSES.includes(d.status)?d.status:STATUSES[0],
    notes:s(d.notes,1000), group:s(d.group,40)||FALLBACK, updated:new Date().toISOString()
  };
}

function parseDate(str){
  str = String(str || '').trim(); if(!str) return '';
  let y, m, d, x;
  if((x = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, m, d] = x;
  else if((x = str.match(/^(\d{1,2})[\/.\-\s](\d{1,2})[\/.\-\s](\d{2}|\d{4})$/))) [, d, m, y] = x;
  else if((x = str.match(/^(\d{2})(\d{2})(\d{4})$/))) [, d, m, y] = x;
  else if((x = str.match(/^(\d{2})(\d{2})(\d{2})$/))) [, d, m, y] = x;
  else return null;
  y = +y; m = +m; d = +d; if(y < 100) y += 2000;
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
const fmtDate = ymd => ymd ? ymd.slice(8,10) + '/' + ymd.slice(5,7) + '/' + ymd.slice(0,4) : '';

document.addEventListener('focusout', e => {

  const v = parseDate(e.target.value);
  if(v){ e.target.value = fmtDate(v); e.target.classList.remove('bad'); } else if(v === null) e.target.classList.add('bad'); else e.target.classList.remove('bad');
});

  let d = String(p || '').replace(/[^\d+]/g, '');
  if(d.startsWith('+')) d = d.slice(1);
  else if(d.startsWith('00')) d = d.slice(2);
  else if(d.startsWith('0')) d = '972' + d.slice(1);
  return d.length >= 9 ? d : '';
}

/* ===================== כניסה: לפי המשתמש של האתר הראשי ===================== */
function login(u, name){
  user = {username:u, name}; items = readJSON(K_DATA(u), []); filter = 'open'; monthSel = '';
  resetHistory(); $('#in-appTitle').textContent = t('app'); render(); initFile();
}
function showAuth(){ user = null; items = []; }
$('#in-logoutBtn').addEventListener('click', async () => { clearTimeout(autoTimer); if(fileHandle) await writeFile(false); fileHandle = null; user = null; document.querySelector('#logoutBtn').click(); });
/* ===================== שמירה + ביטול ===================== */
let undoStack = [], redoStack = [], curState = '';
const stateNow = () => JSON.stringify(items);
function resetHistory(){ undoStack = []; redoStack = []; curState = stateNow(); updUndo(); }
function updUndo(){ $('#in-undoBtn').disabled = !undoStack.length; $('#in-redoBtn').disabled = !redoStack.length; }
function persist(){
  if(!writeJSON(K_DATA(user.username), items)) return false;
  const now = stateNow(); if(now !== curState){ undoStack.push(curState); if(undoStack.length > 60) undoStack.shift(); redoStack = []; curState = now; }
  updUndo(); scheduleAutoSave(); return true;
}
function applyState(str){ items = JSON.parse(str); writeJSON(K_DATA(user.username), items); curState = str; scheduleAutoSave(); render(); updUndo(); }
function undo(){ if(!user) return; if(!undoStack.length) return toast(t('nothing_undo')); redoStack.push(curState); applyState(undoStack.pop()); toast(t('undone')); }
function redo(){ if(!user) return; if(!redoStack.length) return toast(t('nothing_redo')); undoStack.push(curState); applyState(redoStack.pop()); toast(t('redone')); }
$('#in-undoBtn').addEventListener('click', undo); $('#in-redoBtn').addEventListener('click', redo);
document.addEventListener('keydown', e => {
  if(!user || $('#inApp').hidden || document.querySelector('dialog[open]')) return;
  const tag = (e.target.tagName || '').toLowerCase(); if(['input','textarea','select'].includes(tag)) return;
  const k = e.key.toLowerCase();
  if((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))){ e.preventDefault(); redo(); }
});

/* קובץ במחשב */
const FS_OK = 'showSaveFilePicker' in window;
let fileHandle = null, autoTimer = null, lastSaved = null, fsLast = '';
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('incheq-fs', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try{ const db = await idb(); return await new Promise(res => { const q = db.transaction('h').objectStore('h').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }catch(e){ return null; } }
async function idbSet(k, v){ try{ const db = await idb(); db.transaction('h','readwrite').objectStore('h').put(v, k); }catch(e){} }
const backupData = () => JSON.stringify({app:'incoming-cheques', user:user.username, exported:new Date().toISOString(), items}, null, 1);
const hhmm = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
async function perm(h, ask){ try{ let p = await h.queryPermission({mode:'readwrite'}); if(p !== 'granted' && ask) p = await h.requestPermission({mode:'readwrite'}); return p === 'granted'; }catch(e){ return false; } }
function fsStatus(state){
  fsLast = state; const el = $('#in-fsStatus');
  if(!FS_OK){ el.innerHTML = ''; return; }
  if(!fileHandle) el.innerHTML = '<span class="dot off"></span>' + esc(t('fs_off'));
  else if(state === 'need') el.innerHTML = `<span class="dot off"></span>${esc(t('fs_need',{f:fileHandle.name}))} <button id="fsAllow">${esc(t('fs_allow'))}</button>`;
  else el.innerHTML = `<span class="dot"></span>${esc(t('fs_ok'))} <b>${esc(fileHandle.name)}</b>${lastSaved ? ' • ' + hhmm(lastSaved) : ''} <button id="fsChange">${esc(t('fs_change'))}</button>`;
}
async function writeFile(ask){
  if(!fileHandle) return false;
  if(!(await perm(fileHandle, ask))){ fsStatus('need'); return false; }
  try{ const w = await fileHandle.createWritable(); await w.write(new Blob([backupData()], {type:'application/json'})); await w.close(); lastSaved = new Date(); fsStatus('ok'); return true; }catch(e){ fsStatus('need'); return false; }
}
function scheduleAutoSave(){ if(!fileHandle) return; clearTimeout(autoTimer); autoTimer = setTimeout(() => writeFile(false), 1200); }
async function pickFile(){

    fileHandle = await window.showSaveFilePicker({suggestedName:`${t('file_prefix')}-${user.name}.json`, types:[{description:t('app'), accept:{'application/json':['.json']}}]});
    await idbSet(user.username, fileHandle);
    if(await writeFile(true)) toast(t('fs_first'));
  }catch(e){ if(e && e.name !== 'AbortError') toast(t('fs_fail')); }
}
async function initFile(){ fileHandle = FS_OK ? await idbGet(user.username) : null; lastSaved = null; if(fileHandle && await perm(fileHandle, false)) await writeFile(false); else fsStatus(fileHandle ? 'need' : ''); }
function download(){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupData()], {type:'application/json'}));
  a.download = `${t('file_prefix')}-${user.name}-${todayYmd()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#in-fileBtn').addEventListener('click', async () => {

$('#in-fsStatus').addEventListener('click', async e => { if(e.target.id === 'fsAllow') writeFile(true); if(e.target.id === 'fsChange') pickFile(); });
$('#in-backupBtn').addEventListener('click', () => { download(); toast(t('backup_done')); });
$('#in-restoreBtn').addEventListener('click', () => $('#in-restoreFile').click());
$('#in-restoreFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const d = JSON.parse(await f.text()); const list = Array.isArray(d) ? d : d.items; if(!Array.isArray(list)) throw 0;

  // לשוניות סטטוס

  }).join('');

  const q = $('#in-q').value.trim().toLowerCase();

  const sortD = arr => arr.sort((a,b) => a.dueDate.localeCompare(b.dueDate));
  $('#in-list').innerHTML = monthSel === 'all'
    ? months.map(k => head(k, byM[k]) + sortD(byM[k]).map(slip).join('')).join('')

function slip(c){
  const [, m, d] = c.dueDate.split('-'), left = daysUntil(c.dueDate);
  let warn = '';
  if(c.status === 'held'){
    if(left < 0) warn = `<span class="warn">${esc(t('overdue'))}</span>`;
    else if(left === 0) warn = `<span class="warn">${esc(t('due_today'))}</span>`;
    else if(left <= 7) warn = `<span class="warn soon">${esc(left === 1 ? t('tomorrow') : t('in_days',{n:left}))}</span>`;
  }
  const bankLine = [c.bank, c.branch && (t('branch') + ' ' + c.branch), c.account && (t('acc') + ' ' + c.account)].filter(Boolean).join(' • ');
  const sent = (c.smsSent ? `<span class="sent">${esc(t('sms_sent',{d:fmtDate(c.smsSent.slice(0,10))}))}</span>` : '') + (c.notified ? `<span class="sent">${esc(t('sent',{d:fmtDate(c.notified.slice(0,10))}))}</span>` : '');
  const btn = (a, k, cls='') => `<button class="${cls}" data-act="${a}" data-id="${esc(c.id)}">${esc(t(k))}</button>`;
  let acts = '';
  if(c.status === 'held') acts += btn('deposited','b_deposit') + btn('passed','b_pass');
  if(['held','deposited','passed'].includes(c.status)) acts += btn('cleared','b_clear') + btn('returned','b_return');
  if(c.status === 'returned') acts += btn('notify','b_notify','wa');
  if(c.status !== 'held') acts += btn('held','b_back');
  acts += btn('edit','b_edit') + btn('del','b_del');
  return `<article class="slip st-${c.status}" data-cid="${esc(c.id)}">
    <div class="stub"><div class="d">${+d}</div><div class="m">${m}/${c.dueDate.slice(0,4)}</div>${c.number?`<div class="no">#${esc(c.number)}</div>`:''}</div>
    <div class="body">
      <div class="row1"><div class="cust">${esc(t('from'))}${esc(c.customer)}${c.purpose?` <span class="ptag p-${c.purpose}">${esc(t('p_'+c.purpose))}</span>`:''}</div><div class="amt">${esc(money(c.amount,c.currency))}</div></div>
      ${bankLine?`<div class="meta">${esc(bankLine)}</div>`:''}
      ${c.drawer?`<div class="meta">${esc(t('drawer'))} <b>${esc(c.drawer)}</b></div>`:''}
      ${c.passedTo?`<div class="meta">${esc(t('to_whom'))}<b>${esc(c.passedTo)}</b>${c.passedDate?` ${esc(t('on_date'))} <b>${fmtDate(c.passedDate)}</b>`:''}</div>`:''}
      ${c.status==='returned' && c.reason?`<div class="meta" style="color:var(--stamp)">${esc(t('f_reason'))}: ${esc(c.reason)}</div>`:''}
      ${c.phone?`<div class="meta" dir="ltr" style="text-align:start">📞 ${esc(c.phone)}</div>`:''}
      ${c.notes?`<div class="notes">${esc(c.notes)}</div>`:''}
      <div class="foot"><div><span class="badge ${c.status}">${esc(t('s_'+c.status))}</span>${warn}${sent}</div><div class="acts2">${acts}</div></div>
    </div>
  </article>`;
}
function updateLists(){
  const u = a => [...new Set(a.filter(Boolean))];
  $('#in-custList').innerHTML = u(items.map(c => c.customer)).map(v => `<option value="${esc(v)}">`).join('');
  $('#in-bankList').innerHTML = u([...items.map(c => c.bank), ...BANKS]).map(v => `<option value="${esc(v)}">`).join('');

  const ymd = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : '';
  return { customer:s(d.customer), phone:s(d.phone,30), purpose:['debt','purchase','other'].includes(d.purpose)?d.purpose:'', amount:Math.round(Number(d.amount)*100)/100, currency:s(d.currency,5)||'₪', dueDate:ymd(d.dueDate), received:ymd(d.received),
    number:s(d.number,40), bank:s(d.bank), branch:s(d.branch,20), account:s(d.account,40), drawer:s(d.drawer), status:STATUSES.includes(d.status)?d.status:'held',
    passedTo:s(d.passedTo), passedDate:ymd(d.passedDate), reason:s(d.reason), notes:s(d.notes,1000), notified:s(d.notified,40), smsSent:s(d.smsSent,40), updated:new Date().toISOString() };
}

  d.passedDate = parseDate(d.passedDate) || (d.status === 'passed' ? todayYmd() : '');

  render(); flash(rec.id);

function setStatus(c, s, extra = {}){

  if(s === 'held'){ c.passedTo = ''; c.passedDate = ''; }

$('#in-list').addEventListener('click', e => {
